name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        optimistix: ["0.0.11", "0.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "jax[cpu]" "optimistix==${{ matrix.optimistix }}" -e ".[test]"
      - name: Fetch the fork used in the paper (oracle; tests skip without it)
        run: |
          git clone --quiet --depth 1 --branch cmame-2026 \
            https://github.com/IvanBioli/optimistix.git oracle \
            && echo "OPTX_ORACLE_PATH=$PWD/oracle/optimistix" >> "$GITHUB_ENV" \
            || echo "oracle tag not available; oracle tests will be skipped"
      - name: Test
        env:
          JAX_ENABLE_X64: "1"
        run: pytest -q tests
