[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssbroyden-optimistix"
version = "0.1.0"
description = "Self-scaling Broyden, BFGS, DFP and L-BFGS with a Zoom line search for Optimistix"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ivan Bioli" }, { name = "Mikel Mendibe" }]
dependencies = ["jax", "equinox", "lineax", "optimistix>=0.0.11,<0.2", "jaxtyping"]

[project.urls]
Repository = "https://github.com/IvanBioli/ssbroyden_optimistix"
Paper = "https://arxiv.org/abs/2603.10599"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/ssbroyden_optimistix"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "example.py", "README.md", "LICENSE", "CITATION.cff"]
